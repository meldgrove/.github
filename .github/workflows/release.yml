# The release workflow of every Meldgrove repository. Each repository calls it
# from its own .github/workflows/release.yml, which holds the triggers
# (workflow_dispatch with bump, candidate and dry_run; pull_request for the
# image build) and the repository's values. README.md shows such a caller.
#
#   prepare  refuses unless started from main, CI passed for the commit, and
#            something changed since the last release. Refuses a version that
#            is too small for a pull request labelled `breaking`. Raises the
#            latest vX.Y.Z tag by the chosen part, tags the commit, and pushes
#            only the tag. No file holds the version and nothing is pushed to
#            main, so no ruleset needs a bypass. A release candidate is
#            vX.Y.Z-rc.N.
#   image    builds and starts the image on amd64 and arm64, pushes it by digest
#   publish  tags both platforms as one image (X.Y.Z, X.Y, X from 1.0.0,
#            latest), attests its provenance, creates the GitHub Release, and
#            moves the branch `stable` to the released commit
#
# A dry run does everything except push and publish. Pull requests that change
# the image build and start both platforms without publishing anything.
# Only GitHub-owned actions pinned by commit SHA (repository Actions settings):
# Docker, uv and npm run through their command lines.

name: Release

on:
  workflow_call:
    inputs:
      bump:
        description: "Version part to raise: patch, minor or major (the first release starts from 0.0.0)"
        type: string
        default: patch
      candidate:
        description: "Release candidate: publish vX.Y.Z-rc.N for testing (no latest)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build, show the version and notes, publish nothing"
        type: boolean
        default: false
      image:
        description: The image to publish, e.g. ghcr.io/meldgrove/logbuch
        type: string
        required: true
      target:
        description: Dockerfile stage to publish; empty publishes the last stage
        type: string
        default: ""
      ci_workflow:
        description: File name of the workflow that must have passed for the commit being released
        type: string
        default: ci.yml
      upgrade_doc:
        description: Path of the upgrade instructions, linked from the release notes
        type: string
        required: true
      title:
        description: Title of the image, e.g. Meldgrove Logbuch
        type: string
        required: true
      description:
        description: One sentence about the image
        type: string
        required: true
      license:
        description: SPDX identifier of the license; empty when the repository has none yet
        type: string
        default: ""
      sentry_org:
        description: Sentry organization of sentry_project
        type: string
        default: ""
      sentry_project:
        description: Sentry project that releases upload their source maps to, with the SENTRY_AUTH_TOKEN secret; empty uploads nothing
        type: string
        default: ""
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Sentry organization token for the source maps of releases
        required: false

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image }}
  TARGET: ${{ inputs.target }}
  CI_WORKFLOW: ${{ inputs.ci_workflow }}
  UPGRADE_DOC: ${{ inputs.upgrade_doc }}
  TITLE: ${{ inputs.title }}
  DESCRIPTION: ${{ inputs.description }}
  LICENSE: ${{ inputs.license }}
  SENTRY_ORG: ${{ inputs.sentry_org }}
  SENTRY_PROJECT: ${{ inputs.sentry_project }}
  # The repository of this file. It signs the attestation of every image, so
  # the check of an image's origin names it (--signer-repo).
  SIGNER_REPO: meldgrove/.github

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Version and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # find the CI run of the commit
      contents: write # push the tag, preview the notes
      pull-requests: read # read the labels of the merged pull requests
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.version.outputs.tags }}
      ref: ${{ steps.version.outputs.ref }}
      revision: ${{ steps.version.outputs.revision }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Require main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start releases from main, not ${GITHUB_REF_NAME}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag
          # A release pushes its tag with these credentials; pull requests need none.
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          CANDIDATE: ${{ inputs.candidate }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          if [ "$EVENT" = pull_request ]; then
            {
              echo "version=0.0.0-pr"
              echo "ref=$GITHUB_SHA"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$passed" != 0 ] || fail "CI has not passed for $GITHUB_SHA. Wait for CI on main to finish, then start the release again."

          # The tags hold the version: the newest release without a suffix,
          # e.g. v1.2.3, raised by the chosen part. The first release starts
          # from 0.0.0, so minor makes it 0.1.0.
          previous=$(git tag --list 'v[0-9]*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')
          if [ -n "$previous" ]; then
            [ "$(git rev-parse "$previous^{commit}")" != "$(git rev-parse HEAD)" ] || fail "Nothing to release: main has no changes since $previous."
          fi
          current=${previous#v}
          IFS=. read -r major minor patch <<< "${current:-0.0.0}"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) fail "bump must be patch, minor or major, not '$BUMP'." ;;
          esac

          if [ "$CANDIDATE" = true ]; then
            [ -z "$(git tag --points-at HEAD --list "v$next-rc.*")" ] || fail "This commit is already a candidate for $next."
            last=$(git tag --list "v$next-rc.*" | sed -nE 's/^v.*-rc\.([0-9]+)$/\1/p' | sort -n | tail -n 1)
            version="$next-rc.$((${last:-0} + 1))"
            prerelease=true
          else
            version="$next"
            prerelease=false
          fi
          tag="v$version"
          ! git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null || fail "The tag $tag exists already."

          notes_from=(-f "tag_name=$tag" -f "target_commitish=$GITHUB_SHA")
          if [ -n "$previous" ]; then
            notes_from+=(-f "previous_tag_name=$previous")
          fi
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_from[@]}" --jq .body)

          # Operators must act on a pull request labelled `breaking`. Such a
          # release starts a new series: a minor version below 1.0.0, a major
          # version from 1.0.0. An image tag that moves within a series (0.3,
          # from 1.0.0 the major version 1) therefore never brings a release
          # that needs manual steps.
          breaking=""
          for number in $(grep -oE '/pull/[0-9]+' <<< "$notes" | grep -oE '[0-9]+' | sort -un || true); do
            labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.labels[].name') || fail "Could not read the labels of pull request #$number."
            if grep -qx breaking <<< "$labels"; then
              breaking="$breaking #$number"
            fi
          done
          if [ -n "$breaking" ]; then
            if [ "$major" = 0 ]; then series=minor; else series=major; fi
            case "$series:$BUMP" in
              minor:patch | major:patch | major:minor)
                fail "Operators must act on$breaking (label breaking), so this release starts a new series: choose $series." ;;
            esac
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "$tag"
          git show --no-patch --format='%H %s' HEAD

          # X.Y.Z always. Releases add X.Y, X from 1.0.0 (a tag 0 would follow
          # every early release), and latest.
          tags="$IMAGE:$version"
          if [ "$prerelease" = false ]; then
            tags="$tags $IMAGE:${version%.*}"
            if [ "${version%%.*}" != 0 ]; then
              tags="$tags $IMAGE:${version%%.*}"
            fi
            tags="$tags $IMAGE:latest"
          fi

          publish=true
          ref="$tag"
          if [ "$DRY_RUN" = true ]; then
            publish=false
            ref="$GITHUB_SHA"
          else
            git push origin "refs/tags/$tag"
          fi

          {
            if [ "$DRY_RUN" = true ]; then
              echo "## Dry run: $tag"
              echo
              echo "Nothing was pushed or published. A real run would publish:"
            else
              echo "## $tag"
            fi
            echo
            for t in $tags; do echo "- \`$t\`"; done
            if [ "$DRY_RUN" = true ]; then
              echo
              echo "$notes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous=$previous"
            echo "prerelease=$prerelease"
            echo "tags=$tags"
            echo "ref=$ref"
            echo "revision=$(git rev-parse HEAD)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image by digest
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # A BuildKit container: it can push an image by its digest alone.
          docker buildx create --use --driver docker-container > /dev/null
          # The commit time, not the build time: the push step builds again
          # from the cache and must produce the same image.
          args=(--platform "linux/$ARCH" --provenance=false
            --build-arg "APP_VERSION=$VERSION"
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)"
            --label "org.opencontainers.image.created=$(git log -1 --format=%cI)")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          # Only releases upload source maps. The build reads the token as a
          # secret, so it stays out of the image and the build arguments; the
          # Dockerfile uploads when the secret is there.
          if [ "$PUBLISH" = true ] && [ -n "$SENTRY_PROJECT" ]; then
            if [ -n "$SENTRY_AUTH_TOKEN" ]; then
              args+=(--secret "id=sentry_auth_token,env=SENTRY_AUTH_TOKEN"
                --build-arg "SENTRY_ORG=$SENTRY_ORG" --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT")
            else
              echo "::warning::The SENTRY_AUTH_TOKEN secret is not set: this release's source maps are not uploaded to Sentry."
            fi
          fi
          printf '%s\n' "${args[@]}" > "$RUNNER_TEMP/build-args"
          docker buildx build "${args[@]}" --output type=docker,name=release:test .

      - name: The image starts on its platform, as a non-root user, with its version
        run: |
          machine=$(docker run --rm --entrypoint uname release:test -m)
          case "$ARCH:$machine" in
            amd64:x86_64 | arm64:aarch64) ;;
            *) echo "::error::The $ARCH image runs on $machine." && exit 1 ;;
          esac
          test "$(docker run --rm --entrypoint id release:test -u)" != 0
          test "$(docker run --rm --entrypoint printenv release:test APP_VERSION)" = "$VERSION"

      - name: Push by digest
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mapfile -t args < "$RUNNER_TEMP/build-args"
          # The same build again, from the cache, pushed without a tag: the
          # publish job tags both platforms together.
          docker buildx build "${args[@]}" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          mkdir -p "$RUNNER_TEMP/digests"
          jq -er '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/digests/$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Safe to re-run alone after a failure ("Re-run failed jobs"): it starts
  # again from the pushed tag.
  publish:
    name: Publish
    needs: [prepare, image]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
      packages: write # tag the image, store the attestation
      id-token: write # sign the attestation
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Tag both platforms as one image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          annotations=(
            "org.opencontainers.image.title=$TITLE"
            "org.opencontainers.image.description=$DESCRIPTION"
            "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            "org.opencontainers.image.version=$VERSION"
            "org.opencontainers.image.revision=$REVISION"
          )
          if [ -n "$LICENSE" ]; then
            annotations+=("org.opencontainers.image.licenses=$LICENSE")
          fi
          for annotation in "${annotations[@]}"; do args+=(--annotation "index:$annotation"); done
          test "$(find "$RUNNER_TEMP/digests" -type f | wc -l)" -eq 2
          for file in "$RUNNER_TEMP"/digests/*; do args+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi
          notes_from=(-f "tag_name=$TAG")
          if [ -n "$PREVIOUS" ]; then
            notes_from+=(-f "previous_tag_name=$PREVIOUS")
          fi
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_from[@]}" --jq .body)
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          body=$(printf '%s\n' \
            "Image: \`$IMAGE:$VERSION\` for linux/amd64 and linux/arm64 (\`$DIGEST\`)" \
            "" \
            "Upgrade: [${UPGRADE_DOC%%#*}]($repo_url/blob/$TAG/$UPGRADE_DOC). Check where the image was built: \`gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY --signer-repo $SIGNER_REPO\`" \
            "" \
            "$notes")
          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f body="$body" \
            -F prerelease="$PRERELEASE" \
            -f make_latest="$latest" \
            --jq .html_url

      # Platforms that read compose.yaml from the repository follow `stable`,
      # so the file they run belongs to the newest release and not to
      # unreleased work on main. The commit is in the repository already, so
      # the workflow's own token may move the branch. Candidates leave it.
      - name: Move the stable branch to the release
        if: env.PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" > /dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$REVISION" --jq .ref
            exit 0
          fi
          # ahead: the release is newer than stable. identical or behind: a
          # re-run, or stable is at a newer release already.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/stable...$REVISION" --jq .status)
          case "$status" in
            ahead) gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$REVISION" -F force=false --jq .ref ;;
            identical | behind) echo "stable is at this release or a newer one already." ;;
            *)
              echo "::error::stable has commits that are not on main ($status). Reset it to a release by hand."
              exit 1
              ;;
          esac

      - name: The check of the image's origin from the release notes passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://$IMAGE:$VERSION" --repo "$GITHUB_REPOSITORY" --signer-repo "$SIGNER_REPO"
